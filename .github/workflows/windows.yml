name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.9'
  # Same TDLib commit (1.8.65) as the Android library, so both apps speak the same Telegram API.
  TDLIB_COMMIT: a8f21f5230172634becc1739050ef23ecd6ea291

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # ---------- Telegram library (tdjson.dll) — built once, then cached ----------
      - name: Restore cached TDLib
        id: tdcache
        uses: actions/cache@v4
        with:
          path: windows/tdlib
          key: tdlib-win64-${{ env.TDLIB_COMMIT }}-v1

      - name: Build TDLib
        if: steps.tdcache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg\vcpkg.exe" install gperf:x64-windows openssl:x64-windows zlib:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg failed" }
          git init td
          cd td
          git remote add origin https://github.com/tdlib/td.git
          git fetch --depth 1 origin $env:TDLIB_COMMIT
          git checkout FETCH_HEAD
          New-Item -ItemType Directory build | Out-Null
          cd build
          cmake -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DGPERF_EXECUTABLE="$vcpkg\installed\x64-windows\tools\gperf\gperf.exe" `
            -DTD_ENABLE_LTO=OFF ..
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build . --target tdjson --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "TDLib build failed" }
          New-Item -ItemType Directory -Force ..\..\windows\tdlib | Out-Null
          Copy-Item Release\*.dll ..\..\windows\tdlib\
          Get-ChildItem ..\..\windows\tdlib

      - name: Check TDLib
        shell: pwsh
        run: |
          if (-not (Test-Path windows\tdlib\tdjson.dll)) { throw "tdjson.dll missing" }
          Get-ChildItem windows\tdlib

      # ---------- Flutter app ----------
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Build TirsoDrive for Windows
        shell: pwsh
        run: |
          flutter config --no-analytics
          flutter pub get
          flutter build windows --release
          if ($LASTEXITCODE -ne 0) { throw "flutter build failed" }

      - name: Add Microsoft C++ runtime files
        shell: pwsh
        run: |
          $out = "build\windows\x64\runner\Release"
          foreach ($f in @("msvcp140.dll","msvcp140_1.dll","vcruntime140.dll","vcruntime140_1.dll")) {
            if (Test-Path "C:\Windows\System32\$f") { Copy-Item "C:\Windows\System32\$f" $out -Force }
          }
          Get-ChildItem $out

      # ---------- Installer + portable zip ----------
      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\tirsodrive.iss
          if ($LASTEXITCODE -ne 0) { throw "installer failed" }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "installer\Output\TirsoDrive-${{ steps.ver.outputs.version }}-portable.zip"
          Get-ChildItem installer\Output

      - uses: actions/upload-artifact@v4
        with:
          name: TirsoDrive-Windows-${{ steps.ver.outputs.version }}
          path: installer/Output/*
          retention-days: 30
